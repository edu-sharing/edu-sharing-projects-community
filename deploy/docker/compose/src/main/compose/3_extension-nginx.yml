version: '3.7'

services:
  repository-service:
    environment:
      REPOSITORY_SERVICE_PORT_EXTERNAL: "${REPOSITORY_SERVICE_PORT:-80}"

  nginx:
    image: "docker.edu-sharing.com/community/common/edu_sharing-community-common-docker-nginx-proxy:1.0.1"
    environment:
      DEFAULT_HOST: "${NGINX_DEFAULT_HOST:-*.127.0.0.1.nip.io,localhost}"
    network_mode: "host"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
